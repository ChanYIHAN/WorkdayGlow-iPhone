name: Validate shared content
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  content:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test Tests/content.test.mjs
      - name: Test Swift catalog and review logic
        run: |
          swiftc Shared/Sources/Vocabulary.swift Shared/Sources/VocabularySeed.swift Shared/Sources/WidgetTemplateCatalog.swift Shared/Sources/ExpansionTemplateCatalog.swift Shared/Sources/ExpandedContent.swift Tests/main.swift -o /tmp/test-content
          /tmp/test-content
