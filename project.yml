name: WorkdayGlow
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Configuration/Config.xcconfig
  Release: Configuration/Config.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.5.0"
    CURRENT_PROJECT_VERSION: "5"
    CODE_SIGN_STYLE: Automatic

targets:
  WorkdayGlow:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WorkdayGlow/Sources
      - path: Shared/Sources
    resources:
      - path: WorkdayGlow/Resources
      - path: Shared/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(APP_BUNDLE_IDENTIFIER)"
        PRODUCT_NAME: WorkdayGlow
        INFOPLIST_FILE: WorkdayGlow/Info.plist
        CODE_SIGN_ENTITLEMENTS: WorkdayGlow/WorkdayGlow.entitlements
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: false
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: WorkdayGlowWidget
        embed: true

  WorkdayGlowWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WorkdayGlowWidget/Sources
      - path: Shared/Sources
    resources:
      - path: WorkdayGlowWidget/Resources
      - path: Shared/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(WIDGET_BUNDLE_IDENTIFIER)"
        PRODUCT_NAME: WorkdayGlowWidget
        INFOPLIST_FILE: WorkdayGlowWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: WorkdayGlowWidget/WorkdayGlowWidget.entitlements
        GENERATE_INFOPLIST_FILE: false
        SKIP_INSTALL: true
        APPLICATION_EXTENSION_API_ONLY: true
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  WorkdayGlow:
    build:
      targets:
        WorkdayGlow: all
        WorkdayGlowWidget: all
    run:
      config: Debug
    archive:
      config: Release
